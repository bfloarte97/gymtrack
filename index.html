   day_name:String(s.dayName||'Entrenamiento').slice(0,120),started_at:s.date,duration_sec:Math.max(0,Math.round(s.durationSec||0)),
   notes:s.notes?String(s.notes).slice(0,2000):null,volume_kg:Math.round(s.volume!=null?s.volume:sessVolume(s)),source:s.source||'web'}));
  const rows=[];s.exercises.forEach((e,ei)=>e.sets.forEach((x,si)=>rows.push({id:s.id+'_'+ei+'_'+si,session_id:s.id,exercise_name:String(e.name).slice(0,120),
   muscle_group:e.group||GROUP_OF[e.name]||null,exercise_order:ei,set_number:clamp(si+1,1,50),weight_kg:clamp(num(x.w),0,1000),reps:clamp(Math.round(num(x.r)),0,500),done_at:x.t||s.date,rpe:x.rpe?clamp(Math.round(x.rpe),1,10):null})));
  chk(await sb.from('session_sets').delete().eq('session_id',s.id));
  if(rows.length)chk(await sb.from('session_sets').insert(rows))},
 async pushBody(entries){
  const rows=entries.map(e=>{const o={id:e.id,entry_date:e.date,weight_kg:e.weight||null,fat_pct:e.fat||null};MEAS.forEach(([k])=>o[k+'_cm']=e[k]||null);return o});
  await this.delMissing('body_entries',rows.map(x=>x.id));
  if(rows.length)chk(await sb.from('body_entries').upsert(rows));
  await this.pushUserSettings()},
 async pushUserSettings(){chk(await sb.from('user_settings').upsert({user_id:this.user.id,weekly_goal:clamp(S.settings.weeklyGoal||3,1,7),body_goal_kg:S.body.goal||null,height_cm:S.body.height||null}))},
 async load(){
  const [r,s,b,st]=await Promise.all([
   sb.from('routines').select('id,name,goal,position,routine_days(id,name,position,routine_exercises(id,name,sets,reps,rest_sec,position))').order('position'),
   sb.from('sessions').select('id,routine_id,routine_name,day_id,day_name,started_at,duration_sec,notes,volume_kg,source,session_sets(exercise_name,muscle_group,exercise_order,set_number,weight_kg,reps,done_at,rpe)').order('started_at'),
   sb.from('body_entries').select('*').order('entry_date'),
   sb.from('user_settings').select('*').maybeSingle()]);
  const R=chk(r)||[],SS=chk(s)||[],B=chk(b)||[],ST=chk(st);
  return{empty:!R.length&&!SS.length&&!B.length&&!ST,
   routines:R.map(x=>({id:x.id,name:x.name,goal:x.goal||'',days:(x.routine_days||[]).sort(byPos).map(d=>({id:d.id,name:d.name,
    exercises:(d.routine_exercises||[]).sort(byPos).map(e=>({id:e.id,name:e.name,sets:e.sets,reps:e.reps,rest:e.rest_sec}))}))})),
   sessions:SS.map(x=>{const ex=[];(x.session_sets||[]).sort((a,b)=>a.exercise_order-b.exercise_order||a.set_number-b.set_number).forEach(t=>{
     let e=ex.find(q=>q.ord===t.exercise_order);if(!e){e={ord:t.exercise_order,name:t.exercise_name,group:t.muscle_group||GROUP_OF[t.exercise_name]||'',sets:[]};ex.push(e)}
     e.sets.push({w:Number(t.weight_kg),r:t.reps,t:t.done_at||null,rpe:t.rpe||null})});
    return{id:x.id,date:x.started_at,routineId:x.routine_id,routineName:x.routine_name||'',dayId:x.day_id,dayName:x.day_name||'Entrenamiento',durationSec:x.duration_sec,
     exercises:ex.map(({ord,...e})=>e),notes:x.notes||'',volume:Number(x.volume_kg),source:x.source}}),
   body:{entries:B.map(e=>{const o={id:e.id,date:e.entry_date,weight:e.weight_kg!=null?Number(e.weight_kg):null,fat:e.fat_pct!=null?Number(e.fat_pct):null};MEAS.forEach(([k])=>o[k]=e[k+'_cm']!=null?Number(e[k+'_cm']):null);return o}),
    goal:ST&&ST.body_goal_kg!=null?Number(ST.body_goal_kg):null,height:ST&&ST.height_cm!=null?Number(ST.height_cm):null},
   settings:{weeklyGoal:ST?ST.weekly_goal:3}}}
};
function setSync(s){const p=$('#sync');p.className='pill '+(s==='cloud'?'ok':s==='error'?'err':'');
 p.textContent={cloud:'☁︎ Guardado en tu cuenta',local:'Guardado en este dispositivo',loading:'Sincronizando…',error:'⚠︎ Error al guardar',offline:'Sin conexión · se subirá luego',auth:'Sin sesión'}[s]||s}
function saveRoutines(){LS.set('gym_routines',S.routines);Cloud.write('routines',()=>Cloud.pushRoutines(clone(S.routines)))}
function saveBody(){LS.set('gym_body',S.body);Cloud.write('body',()=>Cloud.pushBody(clone(S.body.entries)))}
function saveSettings(){LS.set('gym_settings',S.settings);Cloud.write('settings',()=>Cloud.pushUserSettings())}
function saveSession(s){LS.set('gym_sessions',S.sessions);Cloud.write('s_'+s.id,()=>Cloud.pushSession(clone(s)))}
function removeSessionCloud(id){LS.set('gym_sessions',S.sessions);Pend.clear('s_'+id);Cloud.write('d_'+id,async()=>{chk(await sb.from('sessions').delete().eq('id',id))})}
function persistActive(){LS.set('gym_active',active)}
function resync(){if(!Cloud.user)return;Object.keys(Pend.get()).forEach(k=>{
 if(k==='routines')saveRoutines();else if(k==='body')saveBody();else if(k==='settings')saveSettings();
 else if(k.startsWith('s_')){const s=S.sessions.find(x=>x.id===k.slice(2));if(s)saveSession(s);else Pend.clear(k)}
 else if(k.startsWith('d_'))removeSessionCloud(k.slice(2));else Pend.clear(k)})}
window.addEventListener('online',resync);

function loadLocal(){
 S.routines=LS.get('gym_routines',[]);S.sessions=LS.get('gym_sessions',[]).sort(byDate);
 S.body=Object.assign({entries:[],goal:null,height:null},LS.get('gym_body',{}));
 S.settings=Object.assign({weeklyGoal:3},LS.get('gym_settings',{}));
 active=LS.get('gym_active',null)}
function clearLocal(){LOCAL_KEYS.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}})}

let starting=null;
function startUser(user){if(starting&&starting.id===user.id)return starting.p;const p=startUserInner(user).finally(()=>{starting=null});starting={id:user.id,p};return p}
async function startUserInner(user){
 // Si este navegador tenía datos de OTRA cuenta, no se mezclan
 const owner=LS.get('gym_owner',null);
 if(owner&&owner!==user.id){clearLocal();loadLocal()}
 Cloud.user=user;LS.set('gym_owner',user.id);
 render();setSync('loading');
 try{
  const c=await withTimeout(Cloud.load());
  if(c.empty){ // primera vez: subo lo que ya tenías en este navegador
   if(S.routines.length)saveRoutines();if(S.body.entries.length||S.body.goal||S.body.height)saveBody();saveSettings();S.sessions.forEach(saveSession);
   if(!S.routines.length&&!S.sessions.length)setSync('cloud')}
  else{
   const P=Pend.get();
   if(!P.routines)S.routines=c.routines;
   if(!P.body){S.body.entries=c.body.entries;S.body.goal=c.body.goal;S.body.height=c.body.height}
   if(!P.settings)S.settings=Object.assign({weeklyGoal:3},c.settings);
   const del=new Set(Object.keys(P).filter(k=>k.startsWith('d_')).map(k=>k.slice(2)));
   const local=S.sessions.filter(s=>P['s_'+s.id]&&!c.sessions.some(x=>x.id===s.id));
   S.sessions=c.sessions.filter(s=>!del.has(s.id)).concat(local).sort(byDate);
   LS.set('gym_routines',S.routines);LS.set('gym_body',S.body);LS.set('gym_settings',S.settings);LS.set('gym_sessions',S.sessions);
   if(Pend.any())resync();else setSync('cloud')}
  if(ui.screen!=='editor')render();
 }catch(e){console.warn(e);setSync(navigator.onLine===false?'offline':'error');toast('No se pudo conectar; usando datos de este dispositivo')}
}

async function boot(){
 loadLocal();
 if(!sb){render();setSync('local');toast('No se pudo cargar Supabase (¿sin conexión?). Trabajando en este dispositivo');return}
 sb.auth.onAuthStateChange((ev,sess)=>{setTimeout(()=>{
  if(ev==='PASSWORD_RECOVERY')openNewPassword();
  else if(ev==='SIGNED_OUT'&&Cloud.user){Cloud.user=null;ui.screen=null;render();setSync('auth')}
  else if(ev==='SIGNED_IN'&&sess&&!Cloud.user)startUser(sess.user)},0)});
 let session=null;try{session=(await sb.auth.getSession()).data.session}catch(e){console.warn(e)}
 if(session)await startUser(session.user);else{render();setSync('auth')}
}

 </div>`}

 if(/signups? (are|is) disabled|signup.*not allowed/i.test(m))return'El registro está desactivado en Supabase: activa «Allow new users to sign up» y el proveedor «Email» en Authentication → Sign In / Providers.';

 if(/password/i.test(m)&&/6|short|weak/i.test(m))return'La contraseña es demasiado corta o débil (mínimo 6 caracteres).';
 if(/rate limit|too many/i.test(m))return'Demasiados intentos. Espera un minuto y vuelve a probar.';
 if(/fetch|network/i.test(m))return'Sin conexión a internet.';
 return m}
async function authGo(){const m=ui.authMode||'login',email=($('#au-email').value||'').trim(),pe=$('#au-pass'),pass=pe?pe.value:'',btn=$('#au-btn');
 ui.authEmail=email;

/* ---------- lógica de entrenamiento ---------- */
function lastPerf(name){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].exercises.find(x=>x.name===name);if(e&&e.sets.length)return e.sets}return null}
function suggest(name,reps,last){
 if(!last)return{w:null,text:'Primera vez: elige un peso con el que completes las reps con buena técnica, dejando 1–2 reps en reserva.'};
 const top=topReps(reps),maxW=Math.max(...last.map(s=>s.w));
 if(maxW<=0)return{w:null,text:'Intenta superar las repeticiones de la última vez.'};
 const work=last.filter(s=>s.w>=maxW);
 if(top&&work.every(s=>s.r>=top)){const nw=maxW+(LOWER.has(name)?5:2.5);return{w:nw,text:`Completaste todas las reps con ${fmtW(maxW)} kg → sube a ${fmtW(nw)} kg`}}
 return{w:maxW,text:`Mantén ${fmtW(maxW)} kg y busca llegar a ${top||'más'} reps en todas las series`}
}
function buildWkEx(name,sets,reps,rest){
 const last=lastPerf(name),sg=suggest(name,reps,last),n=sets||3,arr=[];
 for(let i=0;i<n;i++)arr.push({w:sg.w!=null?String(sg.w):(last&&last[i]&&last[i].w?String(last[i].w):''),r:'',done:false});
 return{name,group:GROUP_OF[name]||'',reps:reps||'8-12',rest:rest||90,sets:arr,prev:last,lastTxt:last?last.map(s=>fmtW(s.w)+'×'+s.r).join(', '):'',sugg:sg.text}
}
function nextDay(r){const last=[...S.sessions].reverse().find(s=>s.routineId===r.id);if(!last)return r.days[0];const i=r.days.findIndex(d=>d.id===last.dayId);return r.days[(i+1)%r.days.length]}
function startWorkout(rid,did){
 if(active){confirmBox('Ya tienes un entrenamiento en curso. ¿Descartarlo y empezar otro?',()=>{active=null;startWorkout(rid,did)},'Descartar',true);return}
 const r=S.routines.find(x=>x.id===rid),d=r&&r.days.find(x=>x.id===did);
 active={id:newId(),routineId:r?r.id:null,routineName:r?r.name:'',dayId:d?d.id:null,dayName:d?d.name:'Entrenamiento libre',start:Date.now(),notes:'',
  exercises:(d?d.exercises:[]).map(e=>buildWkEx(e.name,e.sets,e.reps,e.rest))};
 persistActive();ui.screen='workout';render();window.scrollTo(0,0);ui.watchLive=null;liveStart()
}
function sessVolume(s){return s.exercises.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0)}
function finishWorkout(force){
 if(!force){const pend=active.exercises.reduce((t,e)=>t+e.sets.filter(s=>!s.done&&num(s.w)>0&&String(s.r).trim()!=='').length,0);
  if(pend){ui.modalCb=null;openModal(`<h3>Tienes ${pend} serie${pend>1?'s':''} con datos pero sin marcar ✓</h3><p class="muted small">Solo se guardan las series marcadas como completadas.</p><button class="btn full" data-act="wk-markall">Marcarlas y terminar</button><button class="btn ghost full" style="margin-top:8px" data-act="wk-finish-force">Terminar sin ellas</button><button class="btn ghost full" style="margin-top:8px" data-act="close">Seguir entrenando</button>`);return}}
 const exs=active.exercises.map(e=>({name:e.name,group:e.group,sets:e.sets.filter(s=>s.done).map(s=>({w:num(s.w),r:Math.round(num(s.r)),t:s.t||null,rpe:s.rpe||null}))})).filter(e=>e.sets.length);
 if(!exs.length){confirmBox('No marcaste ninguna serie como completada. ¿Descartar el entrenamiento?',discardWorkout,'Descartar',true);return}
 const best={};S.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(x=>{const v=e1rm(x.w,x.r);if(v>(best[e.name]||0))best[e.name]=v})));
 const prs=[];exs.forEach(e=>{let b=0,bs=null;e.sets.forEach(x=>{const v=e1rm(x.w,x.r);if(v>b){b=v;bs=x}});if(best[e.name]&&b>best[e.name]+.01)prs.push({name:e.name,w:bs.w,r:bs.r,e1:b})});
 const sess={id:active.id,date:new Date(active.start).toISOString(),routineId:active.routineId,routineName:active.routineName,dayId:active.dayId,dayName:active.dayName,durationSec:Math.round((Date.now()-active.start)/1000),exercises:exs,notes:active.notes||''};
 sess.volume=Math.round(sessVolume(sess));
 S.sessions.push(sess);S.sessions.sort(byDate);saveSession(sess);liveEnd(sess.id);
 active=null;persistActive();stopRest();ui.screen=null;ui.tab='home';render();window.scrollTo(0,0);
 const nSets=exs.reduce((a,e)=>a+e.sets.length,0);
 openModal(`<div style="text-align:center"><div style="font-size:44px">🎉</div><h2>¡Entrenamiento completado!</h2><p class="muted">${esc(sess.dayName)}</p></div>
 <div class="grid3" style="margin:14px 0"><div class="stat"><div class="v">${fmtDur(sess.durationSec)}</div><div class="l">Duración</div></div><div class="stat"><div class="v">${nSets}</div><div class="l">Series</div></div><div class="stat"><div class="v">${(sess.volume/1000).toFixed(1)}t</div><div class="l">Volumen</div></div></div>
 ${prs.length?`<div class="card"><h3>🏆 Nuevos récords</h3>${prs.map(p=>`<div class="list-item"><span>${esc(p.name)}</span><span class="pr">${fmtW(p.w)} kg × ${p.r}</span></div>`).join('')}</div>`:''}
 <button class="btn ghost full" style="margin-bottom:8px" data-act="sess-edit" data-id="${sess.id}">✏️ Corregir peso / reps</button><button class="btn full" data-act="close">Listo</button>`)
}
function discardWorkout(){if(active)liveEnd(active.id);active=null;persistActive();stopRest();ui.screen=null;render()}

/* ---------- descanso y sonido ---------- */
let rest=null,actx=null;
function ensureAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(actx)[0,.3,.6].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const s=actx.currentTime+t;g.gain.setValueAtTime(.25,s);g.gain.exponentialRampToValueAtTime(.001,s+.22);o.start(s);o.stop(s+.22)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec};drawRest()}
function stopRest(){rest=null;drawRest()}
function drawRest(){const el=$('#restbar');if(!rest){el.classList.remove('show');el.innerHTML='';renderActiveBar();return}
 const left=Math.max(0,(rest.end-Date.now())/1000);
 if(!el.classList.contains('show')){el.classList.add('show');el.innerHTML=`<div class="floating"><div class="row between"><div><div class="small muted">Descanso</div><div class="rest-t" id="rest-t"></div></div><div class="row gap"><button class="btn sm ghost" data-act="rest-add" data-s="-15">−15</button><button class="btn sm ghost" data-act="rest-add" data-s="15">+15</button><button class="btn sm" data-act="rest-skip">Saltar</button></div></div><div class="bar"><div id="rest-bar"></div></div></div>`}
 syncBars();$('#rest-t').textContent=fmtDur(left);$('#rest-bar').style.width=(100*left/rest.total)+'%';
 $('#activebar').classList.remove('show');
 if(left<=0){beep();toast('¡Descanso terminado! A la siguiente serie 💪');stopRest()}
}
setInterval(()=>{if(rest)drawRest();if(active){const t=fmtDur((Date.now()-active.start)/1000);const a=$('#elapsed');if(a)a.textContent=t;const b=$('#ab-time');if(b)b.textContent=t}},250);

const ICONS={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',routines:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',progress:'<path d="M3 20h18M6 16l4-5 3 3 6-7"/>',body:'<circle cx="12" cy="5" r="2.5"/><path d="M12 8v6m-5-4h10M9 21l3-7 3 7"/>',more:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10l2 2M5 19l2-2m10-10l2-2"/>'};

function computePRs(){const best={},ev=[];S.sessions.forEach(s=>s.exercises.forEach(e=>{let b=0,bs=null;e.sets.forEach(x=>{const v=e1rm(x.w,x.r);if(v>b){b=v;bs=x}});if(!bs)return;if(best[e.name]&&b>best[e.name]+.01)ev.push({date:s.date,name:e.name,w:bs.w,r:bs.r,e1:b});if(b>(best[e.name]||0))best[e.name]=b}));return ev}
function weekStats(){const goal=S.settings.weeklyGoal||3,ws=weekStart(new Date());
 const counts={};S.sessions.forEach(s=>{const k=weekStart(s.date).getTime();counts[k]=(counts[k]||0)+1});
 const thisW=counts[ws.getTime()]||0;let streak=0,d=new Date(ws);if(thisW>=goal)streak=1;
 d.setDate(d.getDate()-7);while((counts[d.getTime()]||0)>=goal){streak++;d.setDate(d.getDate()-7)}
 const vol=S.sessions.filter(s=>new Date(s.date)>=ws).reduce((a,s)=>a+(s.volume||sessVolume(s)),0);
 return{goal,thisW,streak,vol}}

 if(!S.sessions.length&&!S.routines.length)return`<h1>${saludo} 💪</h1>${watchLiveBanner()}${bodyReminder()}${reportReminder()}<div class="card"><h2 style="margin-bottom:6px">Bienvenido a GymTrack</h2><p class="muted" style="margin-top:0">Empieza en 3 pasos:</p>

 <div class="list-item"><span class="tag ac">3</span><div style="flex:1"><b>Mira tu progreso</b><div class="muted small">La app te dice cuándo subir de peso y guarda tus récords.</div></div></div>
 <button class="btn full" style="margin-top:12px" data-act="gen-open">✨ Generar mi primera rutina</button><button class="btn ghost full" style="margin-top:8px" data-act="new-routine">Crear rutina a mano</button><button class="btn ghost full" style="margin-top:8px" data-act="start-free">Entrenar sin rutina</button></div>`;
 let html=`<h1>${saludo} 💪</h1>${watchLiveBanner()}${bodyReminder()}${reportReminder()}
 <div class="card row gap" style="gap:16px"><div class="ring" style="--p:${pct}"><div>${st.thisW}/${st.goal}</div></div><div><b>Meta semanal</b><div class="muted small" style="margin-top:3px">${st.thisW>=st.goal?'¡Meta cumplida esta semana! 🔥':`Te faltan ${st.goal-st.thisW} entrenamiento${st.goal-st.thisW>1?'s':''} esta semana`}</div></div></div>
 <div class="grid3" style="margin-bottom:12px"><div class="stat"><div class="v">${st.streak}</div><div class="l">Racha (semanas)</div></div><div class="stat"><div class="v">${(st.vol/1000).toFixed(1)}t</div><div class="l">Kg esta semana</div></div><div class="stat"><div class="v">${S.sessions.length}</div><div class="l">Entrenos totales</div></div></div>`;
 html+=`<div class="card"><div class="row between"><h3 style="margin:0">Empezar a entrenar</h3><button class="btn sm ghost" data-act="start-free">Libre</button></div>`;
 if(!S.routines.length)html+=`<div class="empty"><div class="big">📋</div>Aún no tienes rutinas.<div class="row gap" style="justify-content:center;margin-top:12px"><button class="btn sm" data-act="gen-open">✨ Generar rutina</button><button class="btn sm ghost" data-act="new-routine">Crear manual</button></div></div>`;
 else S.routines.forEach(r=>{const nd=nextDay(r);if(!nd)return;html+=`<button class="day-btn next" data-act="start" data-r="${r.id}" data-d="${nd.id}"><span><span class="muted small">${esc(r.name)} · te toca</span><br>${esc(nd.name)}</span><span class="tag ac">▶ Empezar</span></button>`});
 html+=`</div>`;
 // calendario
 const keys=new Set(S.sessions.map(s=>dateKey(s.date))),start=weekStart(new Date());start.setDate(start.getDate()-77);const today=dateKey(new Date());
 let cells='';for(let i=0;i<84;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=dateKey(d);cells+=`<i class="${keys.has(k)?'on':''} ${k===today?'today':''}" title="${k}"></i>`}
 html+=`<div class="card"><div class="row between"><h3 style="margin:0">Constancia · 12 semanas</h3></div><div class="row" style="gap:6px;margin-top:12px;align-items:stretch"><div class="heat" style="grid-auto-columns:auto;font-size:9.5px;color:var(--mu)">${['L','M','M','J','V','S','D'].map(x=>`<span style="line-height:1;display:flex;align-items:center">${x}</span>`).join('')}</div><div class="heat" style="flex:1">${cells}</div></div><div class="muted small" style="margin-top:8px">${S.sessions.filter(s=>Date.now()-new Date(s.date)<30*864e5).length} entrenamientos en los últimos 30 días</div></div>`;
 const prs=computePRs().slice(-5).reverse();
 if(prs.length)html+=`<div class="card"><h3>🏆 Récords recientes</h3>${prs.map(p=>`<div class="list-item"><div>${esc(p.name)}<div class="muted small">${fmtDate(p.date)}</div></div><span class="pr">${fmtW(p.w)} kg × ${p.r}</span></div>`).join('')}</div>`;
 const last=S.sessions[S.sessions.length-1];
 if(last)html+=`<div class="card"><h3>Último entrenamiento</h3><div class="row between"><div><b>${esc(last.dayName)}</b><div class="muted small">${fmtDate(last.date)} · ${fmtDur(last.durationSec)} · ${last.exercises.length} ejercicios</div></div><span class="tag">${((last.volume||sessVolume(last))/1000).toFixed(1)} t</span></div></div>`;
 return html
}

 const splitName={2:'Full Body',3:'Full Body',4:'Torso / Pierna',5:'Empuje-Tirón-Pierna + Torso/Pierna',6:'Empuje / Tirón / Pierna ×2'}[days];

function viewWorkout(){const a=active;

  h+=`</div><div class="row gap" style="margin-top:8px"><button class="btn sm ghost" data-act="wk-addset" data-ei="${ei}">+ Serie</button><button class="btn sm ghost" data-act="wk-rmset" data-ei="${ei}" ${ex.sets.length<2?'disabled':''}>− Serie</button></div></div>`});

/* ---------- PROGRESO ---------- */
function exHistory(name){return S.sessions.map(s=>{const e=s.exercises.find(x=>x.name===name);if(!e||!e.sets.length)return null;return{date:s.date,e1:Math.max(...e.sets.map(x=>e1rm(x.w,x.r))),maxW:Math.max(...e.sets.map(x=>x.w)),vol:e.sets.reduce((a,x)=>a+x.w*x.r,0)}}).filter(Boolean)}
function viewProgress(){
 if(!S.sessions.length)return`<h1>Progreso</h1>${reportCard()}<div class="card empty"><div class="big">📈</div>Cuando registres tus entrenamientos verás aquí tu evolución: fuerza por ejercicio, volumen semanal, récords y balance muscular.</div>`;
 const freq={};S.sessions.forEach(s=>s.exercises.forEach(e=>freq[e.name]=(freq[e.name]||0)+1));
 const exs=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);if(!ui.progEx||!freq[ui.progEx])ui.progEx=exs[0];
 const hist=exHistory(ui.progEx),first=hist[0],last=hist[hist.length-1],bestE=Math.max(...hist.map(x=>x.e1)),bestW=Math.max(...hist.map(x=>x.maxW));
 const ch=first&&first.e1?Math.round(100*(last.e1-first.e1)/first.e1):0;
 let h=`<h1>Progreso</h1>${reportCard()}<div class="card"><label>Ejercicio</label><select data-act-change="progEx">${exs.map(n=>`<option ${n===ui.progEx?'selected':''}>${esc(n)}</option>`).join('')}</select>
 <div class="grid3" style="margin:12px 0"><div class="stat"><div class="v">${fmtW(Math.round(bestE*10)/10)}</div><div class="l">1RM estimado (kg)</div></div><div class="stat"><div class="v">${fmtW(bestW)}</div><div class="l">Peso máximo (kg)</div></div><div class="stat"><div class="v" style="color:${hist.length<2?'var(--mu)':ch>=0?'var(--ok)':'var(--dg)'}">${hist.length<2?'—':(ch>=0?'+':'')+ch+'%'}</div><div class="l">Cambio de fuerza</div></div></div>
 ${hist.length>1?'<canvas id="chEx"></canvas>':'<div class="muted small">Registra este ejercicio en al menos 2 sesiones para ver la gráfica.</div>'}</div>`;
 h+=`<div class="card"><h3>Volumen semanal (kg levantados)</h3><canvas id="chVol"></canvas></div>`;
 // balance muscular
 const cut=Date.now()-30*864e5,grp={};S.sessions.filter(s=>new Date(s.date)>=cut).forEach(s=>s.exercises.forEach(e=>{const g=GROUP_OF[e.name]||'Otros';grp[g]=(grp[g]||0)+e.sets.length}));
 const mx=Math.max(1,...Object.values(grp));
 h+=`<div class="card"><h3>Series por grupo muscular · 30 días</h3>${Object.keys(grp).length?Object.entries(grp).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<div class="hbar"><span>${esc(g)}</span><div class="t"><div style="width:${100*n/mx}%"></div></div><b>${n}</b></div>`).join(''):'<div class="muted small">Sin datos en los últimos 30 días.</div>'}<div class="muted small" style="margin-top:8px">Referencia: 10–20 series semanales por grupo suele ser un buen rango para ganar músculo.</div></div>`;
 // récords
 const best={};S.sessions.forEach(s=>s.exercises.forEach(e=>e.sets.forEach(x=>{const v=e1rm(x.w,x.r);if(!best[e.name]||v>best[e.name].e1)best[e.name]={e1:v,w:x.w,r:x.r,date:s.date}})));

// Muestra el Markdown del informe (títulos, listas, negritas y tablas)
function md(t){const lines=esc(t).split('\n');let h='',list=null,tbl=[];
 const inl=x=>x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,'$1<i>$2</i>');
 const endList=()=>{if(list){h+=`</${list}>`;list=null}};
 const endTable=()=>{if(tbl.length){h+='<table class="pct">'+tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map((r,i)=>'<tr>'+r.replace(/^\s*\||\|\s*$/g,'').split('|').map(c=>`<td>${i===0?'<b>'+inl(c.trim())+'</b>':inl(c.trim())}</td>`).join('')+'</tr>').join('')+'</table>';tbl=[]}};
 for(const ln of lines){let m;
  if(/^\s*\|.*\|\s*$/.test(ln)){endList();tbl.push(ln);continue}endTable();
  if((m=ln.match(/^(#{1,4})\s+(.*)/))){endList();const lv=Math.min(4,m[1].length+1);h+=`<h${lv}>${inl(m[2])}</h${lv}>`}
  else if((m=ln.match(/^\s*[-*•]\s+(.*)/))){if(list!=='ul'){endList();h+='<ul>';list='ul'}h+=`<li>${inl(m[1])}</li>`}
  else if((m=ln.match(/^\s*\d+[.)]\s+(.*)/))){if(list!=='ol'){endList();h+='<ol>';list='ol'}h+=`<li>${inl(m[1])}</li>`}
  else if(!ln.trim())endList();
  else{endList();h+=`<p>${inl(ln)}</p>`}}
 endList();endTable();return h}

  const ws=weekStart(new Date()),labels=[],vals=[];for(let i=9;i>=0;i--){const a=new Date(ws);a.setDate(a.getDate()-7*i);const b=new Date(a);b.setDate(b.getDate()+7);labels.push(shortDate(a));vals.push(Math.round(S.sessions.filter(s=>{const d=new Date(s.date);return d>=a&&d<b}).reduce((t,s)=>t+(s.volume||sessVolume(s)),0)))}
  chart('chVol',{type:'bar',data:{labels,datasets:[{label:'kg',data:vals,backgroundColor:'#5ad1ff',borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{grid:{display:false}}}}});
 }
 if(ui.tab==='body'){const E=[...S.body.entries].sort((a,b)=>a.date<b.date?-1:1);const W=E.filter(e=>e.weight);
  if(W.length>1){const ds=[{label:'Peso',data:W.map(e=>e.weight),borderColor:'#c6f432',backgroundColor:'#c6f432',tension:.3,pointRadius:3}];if(S.body.goal)ds.push({label:'Meta',data:W.map(()=>S.body.goal),borderColor:'#8d93a3',borderDash:[5,5],pointRadius:0});
   chart('chBody',{type:'line',data:{labels:W.map(e=>shortDate(e.date+'T12:00')),datasets:ds},options:{plugins:{legend:{labels:{boxWidth:10}}},scales:{y:{title:{display:true,text:'kg'}}}}})}
  const ms=[...MEAS.map(([k,l,,c])=>[k,l,c]),['fat','% grasa','#ff5d8a']].filter(([k])=>E.some(e=>e[k]));
  if(ms.length&&E.length>1)chart('chMeas',{type:'line',data:{labels:E.map(e=>shortDate(e.date+'T12:00')),datasets:ms.map(([k,l,c])=>({label:l,data:E.map(e=>e[k]||null),borderColor:c,backgroundColor:c,spanGaps:true,tension:.3,pointRadius:3}))},options:{plugins:{legend:{labels:{boxWidth:10}}}}})
 }
}

document.addEventListener('click',e=>{ensureAudio();const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f){e.preventDefault();f(t.dataset)}});

 else if(d.ed&&ui.editing){ui.dirty=true;const r=ui.editing;if(d.ed==='name')r.name=t.value;else if(d.ed==='day')r.days[d.di].name=t.value;else if(d.ed==='ex')r.days[d.di].exercises[d.xi][d.f]=t.value}
 else if(d.pk==='q'&&ui.picker){ui.picker.q=t.value;$('#pk-list').innerHTML=pickerList()}
 else if(d.calc==='1')calc1();else if(d.calc==='2')calc2();
});

 else if(d.bodyset){const v=num(t.value);S.body[d.bodyset]=v>0?v:null;saveBody();render()}
